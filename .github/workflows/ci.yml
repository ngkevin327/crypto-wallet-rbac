name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        continue-on-error: true

      - run: pnpm install
        if: failure()

      - run: pnpm --filter @wtp/api typecheck
      - run: pnpm --filter @wtp/shared typecheck
      - run: pnpm --filter @wtp/policy-engine typecheck
      - run: pnpm --filter @wtp/web typecheck

  api-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: wtp
          POSTGRES_PASSWORD: wtp_local
          POSTGRES_DB: wtp
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://wtp:wtp_local@localhost:5432/wtp?schema=public
      JWT_ACCESS_SECRET: ci-test-secret-minimum-16-chars
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install
      - run: pnpm --filter @wtp/api exec prisma generate
      - run: pnpm --filter @wtp/api exec prisma migrate deploy
        working-directory: apps/api
      - run: pnpm --filter @wtp/api test
      - run: pnpm --filter @wtp/shared test
      - run: pnpm --filter @wtp/policy-engine test

  policy-engine-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install
      - run: pnpm --filter @wtp/policy-engine test -- --coverage
