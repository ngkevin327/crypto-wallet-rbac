name: Nightly smoke

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  price-oracle-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install
      - name: CoinGecko USDC price smoke
        if: ${{ secrets.COINGECKO_API_KEY != '' }}
        env:
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
        run: pnpm --filter @wtp/api exec tsx scripts/smoke-price-oracle.ts
      - name: Skip when API key missing
        if: ${{ secrets.COINGECKO_API_KEY == '' }}
        run: echo "Skipping live CoinGecko smoke — COINGECKO_API_KEY not configured"
