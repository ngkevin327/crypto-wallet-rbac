services:
  postgres:
    image: postgres:15-alpine
    container_name: wtp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: wtp
      POSTGRES_PASSWORD: wtp_local
      POSTGRES_DB: wtp
    ports:
      - "5432:5432"
    volumes:
      - wtp_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wtp -d wtp"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: wtp-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - wtp_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api-worker:
    profiles: ["workers"]
    image: node:20-alpine
    container_name: wtp-api-worker
    working_dir: /app
    command: sh -c "corepack enable && pnpm install && pnpm --filter @wtp/api worker"
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://wtp:wtp_local@postgres:5432/wtp
      REDIS_URL: redis://redis:6379
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  wtp_postgres_data:
  wtp_redis_data:
